# configs/kaggle_2gpu.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Q1 Emotion Recognition Framework – Kaggle 2×GPU (2×T4 / 2×P100) Configuration
#
# Kaggle GPU Quota:   2× T4  (15 GB VRAM each  =  30 GB total)
#                  OR 2× P100 (16 GB VRAM each  =  32 GB total)
#
# Strategy for Dual-GPU:
#   • nn.DataParallel splits each mini-batch across both GPUs automatically.
#   • Per-GPU batch: 32  →  total batch per step: 32 × 2 = 64
#   • With grad_accum_steps: 2, effective batch = 64 × 2 = 128
#     (this matches a full A100 40 GB single-GPU run in terms of gradient signal)
#   • All results still save to /kaggle/working (writable path).
#
# Usage on Kaggle:
#   python master_experiment.py --config configs/kaggle_2gpu.yaml
# ─────────────────────────────────────────────────────────────────────────────

# ── Reproducibility ──────────────────────────────────────────────────────────
seed: 42
deterministic: false         # false = cuDNN benchmark mode (faster on fixed-size inputs)
                             # Set true only for final paper submission run

# ── Dataset Split ────────────────────────────────────────────────────────────
val_split: 0.15              # 15 % validation
test_split: 0.15             # 15 % independent test (for paper reporting)
save_split_indices: true     # Save exact indices for reproducibility

# ── Model ────────────────────────────────────────────────────────────────────
model: convnext_v2
num_classes: 7
input_size_warm: 224         # Warmup at 224² (fits both T4 and P100 comfortably)
input_size_ft: 288           # Higher resolution fine-tune: 288² is safe with 30 GB total
                             # (ConvNeXt-V2 Base at 288² ≈ 10 GB per GPU with bs=32)
pretrained: true

# ── Multi-GPU ────────────────────────────────────────────────────────────────
multi_gpu: false             # Enable nn.DataParallel (auto-detected if ≥2 GPUs available)
                             # Splits each mini-batch across all visible CUDA devices.
                             # Set false to force single-GPU even on 2×GPU Kaggle instance.

# ── Training Schedule ────────────────────────────────────────────────────────
epochs_warm: 2               # 3 warm epochs (backbone frozen, head only)
epochs_ft: 20              # More epochs: dual GPU ≈ 2× throughput vs single T4
                             # 30 epochs on 2×T4 ≈ same wall-clock as 20 epochs on 1×A100
batch_size: 32               # Per-GPU batch size (DataParallel doubles to 64 per step)
grad_accum_steps: 2          # Gradient accumulation steps
                             # effective_batch_size = 32 × 2 GPUs × 2 accum = 128
max_grad_norm: 5.0

# ── Learning Rate ─────────────────────────────────────────────────────────────
# Scale LR linearly with effective batch size relative to default config:
#   default eff_bs = 64,  kaggle_2gpu eff_bs = 128  →  LR × 2
lr: 6.0e-5                   # 2× default lr=3e-5, linear-scaled for eff_bs=128
weight_decay: 0.05
backbone_lr_ratio: 0.1       # Backbone LR = lr × ft_lr_ratio × backbone_lr_ratio
ft_lr_ratio: 0.3
warmup_start_factor: 0.01    # Start at 1% of base_lr, ramp to 100% over first epoch

# ── Regularisation ───────────────────────────────────────────────────────────
label_smoothing: 0.1
head_dropout: 0.2
use_focal_loss: false
focal_gamma: 2.0

# ── Sampling / Evaluation ──────────────────────────────────────────────────────
use_class_sampler: false     # Already balanced via balance_dataset
use_tta: true                # TTA at inference (+0.5–1.5% acc)

# ── Early Stopping ───────────────────────────────────────────────────────────
early_stop: 12               # More patience since more epochs available

# ── Augmentation ─────────────────────────────────────────────────────────────
use_mixup: true
mixup_alpha: 0.4
mixup_prob: 0.5
use_cutmix: false
cutmix_alpha: 1.0
cutmix_prob: 0.5
randaugment: true
randaugment_num_ops: 2
randaugment_magnitude: 9
use_novel_aug: true
fourier_aug_p: 0.4
contrastive_noise_p: 0.3
augmix_lite_p: 0.4
random_erasing_p: 0.2
finetune_clean_epochs: 5     # Final 5 epochs with mild augmentation

# ── Dataset Balancing ────────────────────────────────────────────────────────
balance_dataset: true
balance_method: both
min_samples_per_class: 8000
max_samples_per_class: auto  # Use full available pool per class
                             # On Kaggle unified corpus: ~9,700/class → ~68k total

# ── Hardware / Performance ───────────────────────────────────────────────────
device: cuda                 # Explicitly set CUDA (Kaggle always has GPU)
num_workers: 4               # 4 workers per process (Kaggle CPU has 4 cores)
use_amp: true                # Mixed precision FP16: ~2× speedup on T4/P100
channels_last: true          # NHWC memory format: 10–20% speedup on modern GPUs
use_torch_compile: false     # Disabled: compile + DataParallel can conflict
pin_memory: false            # Disabled to save CPU RAM (prevents Kaggle OOM kernel crashes)
prefetch_factor: 2           # Reduced from 4 to 2 to cut dataloader memory in half
use_ema: true
ema_decay: 0.9997

# ── Checkpointing ────────────────────────────────────────────────────────────
save_full_checkpoint: true   # Save weights + optimizer + scheduler + config
save_split_indices: true

# ── Logging ──────────────────────────────────────────────────────────────────
log_csv: true                # Per-epoch CSV (monitor with pandas in Kaggle notebook)

# ── Output ───────────────────────────────────────────────────────────────────
results_dir: /kaggle/working/Results_Q1   # Writable Kaggle path
                                          # Auto-redirected by master_experiment.py
                                          # if IS_KAGGLE is detected

# ── Post-Training Evaluation Pipeline ────────────────────────────────────────
run_benchmark_eval: true      # Eval on FER2013 PrivateTest / RAF-DB test_* / AffectNet Test/
run_baselines: false          # Train ResNet-18/EfficientNet-B0 under identical protocol
                              # Set true if you want fair reproduced baseline comparison
baseline_models: [resnet18, efficientnet_b0]
run_cross_dataset: true       # Train-on-one, test-on-others + domain-shift diagnosis
export_repro_bundle: true     # Package all scripts + splits + weights for GitHub release

# ── Ablation Study ────────────────────────────────────────────────────────────
run_ablation: true            # ✅ ENABLED for Kaggle 2×T4 run
                              # 9 configs × 3 seeds = 27 training runs total
                              # Each ablation run uses reduced epochs for speed:
                              #   epochs_warm capped at 2, epochs_ft capped at 10
ablation_seeds: [42, 123, 456]
                              # Results saved to:
                              #   /kaggle/working/Results_Q1/{exp_id}_ablation/
                              #     convnext_v2/
                              #       ablation_results.json          ← mean ± std per config
                              #       ablation_significance_tests.csv ← Welch t-test table
                              #       convnext_v2_ablation_study.png  ← bar chart

# ─────────────────────────────────────────────────────────────────────────────
# FULL PIPELINE WALL-CLOCK ESTIMATE on Kaggle 2×T4 (~68k samples at 288²):
#
#   Phase                         Time
#   ─────────────────────────────────────
#   Dataset prep + balancing      ~5–10 min
#   Main training (warm 3 + FT 30 ep)  ~80–105 min
#   Benchmark eval (3 datasets)   ~5–10 min
#   Cross-dataset eval             ~30–45 min
#   Ablation (9 configs × 3 seeds, capped epochs):
#     Each run  : ~15–25 min  (2 warm + 10 FT epochs)
#     Total     : ~6–10 hours
#   Export reproducibility bundle  ~2 min
#   ─────────────────────────────────────
#   GRAND TOTAL                   ~7–12 hours
#   (within Kaggle 12-hour session limit with 2×T4)
#
# EXPECTED PERFORMANCE on Kaggle 2×T4:
#   Warm epoch 1  : ValAcc ≈ 0.62–0.68
#   Warm epoch 3  : ValAcc ≈ 0.78–0.83
#   FT epoch 5    : ValAcc ≈ 0.87–0.91
#   FT epoch 15   : ValAcc ≈ 0.91–0.93
#   FT epoch 25+  : ValAcc ≈ 0.92–0.95  (best model saved)
#
# EXPECTED ABLATION RESULTS (approximate, 3-seed mean ± std):
#   baseline             : Acc ≈ 0.83–0.86 ± 0.01
#   mixup_only           : Acc ≈ 0.87–0.89 ± 0.01
#   cutmix_only          : Acc ≈ 0.86–0.88 ± 0.01
#   randaugment_only     : Acc ≈ 0.87–0.89 ± 0.01
#   novel_aug_only       : Acc ≈ 0.86–0.88 ± 0.01
#   no_balancing         : Acc ≈ 0.85–0.87 ± 0.01
#   no_progressive_ft    : Acc ≈ 0.87–0.90 ± 0.01
#   fer2013_only         : Acc ≈ 0.80–0.85 ± 0.01
#   full_pipeline        : Acc ≈ 0.92–0.95 ± 0.005  ← BEST
# ─────────────────────────────────────────────────────────────────────────────
